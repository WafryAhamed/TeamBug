<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background subtle texture -->
  <defs>
    <pattern id="subtle-texture" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="#e0e0e0" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Main Logo Composition -->
  <g transform="translate(100, 80) scale(0.7)">
    <!-- Digital Pixels/Circuit Integration -->
    <path d="M50 50 
             L100 0 
             L150 50 
             L100 100 Z" 
          fill="#2ecc71" 
          opacity="0.2" 
          stroke="#27ae60" 
          stroke-width="3"/>
    
    <!-- Leaf Integrated into Digital Shape -->
    <path d="M75 75 
             Q100 50, 125 75 
             C150 100, 100 125, 100 150 
             C100 125, 50 100, 75 75" 
          fill="#27ae60" 
          opacity="0.8"/>
    
    <!-- Subtle Circuit-like Lines -->
    <path d="M50 50 L75 75 M150 50 L125 75" 
          stroke="#2c3e50" 
          stroke-width="2" 
          opacity="0.3"/>
  </g>
  
  <!-- Brand Name -->
  <text x="200" y="250" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#2c3e50">
    EcoScribe
  </text>
</svg>
